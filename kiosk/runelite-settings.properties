# Starting RuneLite settings for a new instance (no GPU on the VM, light use).
# Copied to <bolt data>/.runelite/settings.properties by add-instance; RuneLite imports it
# into its "default" profile on first start. Change anything later in RuneLite itself.

# GPU plugin renders in software (llvmpipe) here and costs a lot of CPU
runelite.gpuplugin=false
# Openbox already removes borders
runelite.uiEnableCustomChrome=false

# FPS Control: OSRS ticks every 0.6 s, and the stream is capped at 30 fps
runelite.fpsplugin=true
fpscontrol.limitFps=true
fpscontrol.maxFps=25
fpscontrol.limitFpsUnfocused=true
fpscontrol.maxFpsUnfocused=10
fpscontrol.drawFps=false
